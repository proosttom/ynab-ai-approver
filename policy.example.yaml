# Example policy (anonymized). Generate your own with `approver distill --months 24`,
# review policy.draft.yaml and save it as policy.yaml (git-ignored).

defaults:
  mode: suggest
  min_confidence: 0.85
  max_amount: 150
  amount_tolerance: 0.2  # auto-approve up to max_amount * (1 + tolerance)
  max_auto_per_run: 30
  flag_auto: purple
  flag_suggest: yellow

categories:
  # 123 txns, purity 100%, p50 71.66, p95 252.34, cv 0.96 | supermarket a, bakery b, supermarket c
  "🛒 Groceries": {mode: "auto", min_confidence: 0.85, max_amount: 250, description: ""}
  # 50 txns, purity 99%, p50 23.42, p95 100.8, cv 0.96 | restaurant a, takeaway.com, snack bar b
  "🍽️ Dining out": {mode: "auto", min_confidence: 0.85, max_amount: 100, description: ""}
  # 28 txns, purity 100%, p50 83.97, p95 118.4, cv 0.71 | fuel station a, railway app
  "⛽️ Gas, train, bus": {mode: "auto", min_confidence: 0.85, max_amount: 120, description: ""}
  # 85 txns, purity 100%, p50 11.47, p95 260.0, cv 2.25 | travel a, sports centre b, jazz club c
  "family trip/activities": {mode: "suggest", min_confidence: 0.85, max_amount: 220, description: "Trips, outings and activities; includes ALL spending abroad"}
  # 59 txns, purity 87%, p50 386.82, p95 803.65, cv 0.66 | loan instalment
  "Property Investment": {mode: "suggest", min_confidence: 0.85, max_amount: 900, description: ""}
  # 1 txns, purity 11%, p50 4.5, p95 4.5, cv 0.0 | debit
  "Bank costs": {mode: "auto", min_confidence: 0.85, max_amount: 5, description: ""}
  "medicine": {mode: "suggest", min_confidence: 0.85, max_amount: 150, description: ""}
  "💸 Taxes or other fees": {mode: "off", min_confidence: 0.85, max_amount: 650, description: ""}

rules:  # payee -> category, no AI needed (payee matching ignores case and spacing)
  - {payee: "supermarket a town", category: "🛒 Groceries"}
  - {payee: "bakery b town", category: "🛒 Groceries", note: "auto-merged 2026-11-08"}
  - {payee: "fuel station a", category: "⛽️ Gas, train, bus"}
  - {payee: "debit", category: "Bank costs", note: "recurring €4.50 card fee"}

instructions:  # family rules for Claude; they override payee history
  - >-
    Every purchase made outside Belgium (payee shows a foreign town or country, a foreign
    currency, or a foreign-only chain) is "family trip/activities", even groceries,
    restaurants, fuel or shops. Online shops billed from abroad are NOT trips.
  - School payments are "✏️ Back to school", not trips.

never_auto_when: [new_payee, amount_outlier, category_drift, corrected_payee, split]
