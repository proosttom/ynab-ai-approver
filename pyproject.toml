[project]
name = "ynab-ai-approver"
version = "0.1.0"
description = "Categorize and approve YNAB transactions with Claude, gated by a per-category policy."
requires-python = ">=3.10"
dependencies = [
  "ynab>=4.2",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6",
  "typer>=0.12",
]

[project.optional-dependencies]
api = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
approver = "approver.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/approver"]

[tool.pytest.ini_options]
pythonpath = ["src"]
